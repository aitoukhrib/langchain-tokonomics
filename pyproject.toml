[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "langchain-tokonomics"
version = "0.1.0"
description = "LangChain integration for Tokonomics — AI cost metering, budget alerts, and spending caps for LLM API calls."
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Zouhair Ait Oukhrib", email = "hello@tokonomics.ca"},
]
keywords = ["langchain", "llm", "cost", "metering", "tokens", "budget", "tokonomics"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "langchain-core>=0.2.0",
    "requests>=2.28.0",
]

[project.urls]
Homepage = "https://tokonomics.ca"
Documentation = "https://tokonomics.ca/docs"
Repository = "https://github.com/aitoukhrib/langchain-tokonomics"
Issues = "https://github.com/aitoukhrib/langchain-tokonomics/issues"
Changelog = "https://github.com/aitoukhrib/langchain-tokonomics/blob/main/CHANGELOG.md"

[tool.setuptools.packages.find]
include = ["langchain_tokonomics*"]
